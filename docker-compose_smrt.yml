version: '3.8'

services:
  api:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: merahputih-transfez-api-smrt:latest
    container_name: merahputih-transfez-api-smrt
    ports:
      - "8083:8083"
    environment:
      - APP_ENV=development-smart-route
      - MODE=api
    env_file:
      - .env-smart-route
    volumes:
      - ./app:/app/app
    networks:
      - app_bmps_service_default
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

  scheduler:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: merahputih-transfez-scheduler-smrt:latest
    container_name: merahputih-transfez-scheduler-smrt
    environment:
      - APP_ENV=development-smart-route
      - MODE=scheduler
    env_file:
      - .env-smart-route
    volumes:
      - ./app:/app/app
    networks:
      - app_bmps_service_default
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

networks:
  app_bmps_service_default:
    name: app_bmps_service_default
    driver: bridge
    external: true
