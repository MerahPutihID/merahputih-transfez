version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: merahputih-transfez-api:latest
    container_name: merahputih-transfez-api
    ports:
      - "8083:8083"
    environment:
      - APP_ENV=development
      - MODE=api
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - app_bmps_service_default
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: merahputih-transfez-scheduler:latest
    container_name: merahputih-transfez-scheduler
    environment:
      - APP_ENV=development
      - MODE=scheduler
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - app_bmps_service_default
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

networks:
  app_bmps_service_default:
    name: app_bmps_service_default
    driver: bridge
    external: true
